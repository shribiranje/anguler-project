<!DOCTYPE html>
<html>
<head>
    <title>AMAZON DIWALI 2026 Shopping</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#232f3e;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#37475a;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
        }

        .products{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            padding:20px;
        }

        .card{
            width:250px;
            background:white;
            margin:15px;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius:10px;
        }

        .price{
            color:green;
            font-size:22px;
            margin:10px 0;
        }

        button{
            background:#ff9900;
            border:none;
            padding:10px 20px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#e68a00;
        }

        footer{
            background:#232f3e;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Freee Online Shopping</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
</nav>

<div class="products">

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="Product">
        <h3>Smart Watch</h3>
        <p class="price">₹1,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="Product">
        <h3>Headphones</h3>
        <p class="price">₹999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="Product">
        <h3>Sports Shoes</h3>
        <p class="price">₹2,499</p>
        <button>Add to Cart</button>
    </div>

</div>

<footer>
    <p>© 2026 SHRI Shopping. All Rights Reserved.</p>
</footer>

</body>
</html>
